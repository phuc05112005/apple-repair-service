name: Build and optionally deploy production images

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the configured VPS after images and tests pass
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: apple_repair_ci
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Import canonical schema
        run: mysql -h127.0.0.1 -uroot -ptest-root-password apple_repair_ci < database/schema.sql
      - name: Backend tests and package
        env:
          TEST_DATABASE_URL: jdbc:mysql://127.0.0.1:3306/apple_repair_ci
          TEST_DATABASE_USERNAME: root
          TEST_DATABASE_PASSWORD: test-root-password
        run: mvn -B package
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm run test:unit && npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: ml/requirements.txt }
      - run: pip install -r ml/requirements.txt
      - run: python -m pytest ml/tests

  images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            dockerfile: Dockerfile
          - component: frontend
            dockerfile: frontend/Dockerfile
          - component: ml
            dockerfile: ml/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/apple-repair-service-${{ matrix.component }}:${{ github.sha }}

  deploy:
    if: ${{ inputs.deploy == true }}
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY" && test -n "$PRODUCTION_ENV" && test -n "$GHCR_USERNAME" && test -n "$GHCR_TOKEN"
      - name: Install SSH key
        env: { VPS_SSH_KEY: '${{ secrets.VPS_SSH_KEY }}' }
        run: mkdir -p ~/.ssh && printf '%s' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
      - name: Stage deployment files and environment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          PORT="${VPS_PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "$VPS_USER@$VPS_HOST" 'mkdir -p /srv/apple-repair-service && cd /srv/apple-repair-service && if [ -f .env ]; then cp .env .env.previous; fi'
          scp -P "$PORT" deploy/docker-compose.production.yml "$VPS_USER@$VPS_HOST:/srv/apple-repair-service/docker-compose.production.yml"
          scp -P "$PORT" deploy/deploy.sh "$VPS_USER@$VPS_HOST:/srv/apple-repair-service/deploy.sh"
          printf '%s' "$PRODUCTION_ENV" | ssh -p "$PORT" "$VPS_USER@$VPS_HOST" 'cat > /srv/apple-repair-service/.env.next && chmod 600 /srv/apple-repair-service/.env.next && mv /srv/apple-repair-service/.env.next /srv/apple-repair-service/.env'
      - name: Authenticate VPS to GHCR
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          PORT="${VPS_PORT:-22}"
          printf '%s' "$GHCR_TOKEN" | ssh -p "$PORT" "$VPS_USER@$VPS_HOST" "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
      - name: Deploy, healthcheck, and roll back on failure
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" 'cd /srv/apple-repair-service && chmod 700 deploy.sh && ./deploy.sh'
