name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  backend:
    name: Backend - Spring Boot
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: apple_repair_service_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Show Java version
        run: java -version

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Verify database schema file exists
        run: |
          if [ ! -f database/schema.sql ]; then
            echo "::error file=database/schema.sql::Canonical database schema is missing from the repository."
            exit 1
          fi

      - name: Import database schema
        run: |
          mysql \
            -h 127.0.0.1 \
            -P 3307 \
            -u root \
            -p123456 \
            apple_repair_service_test < database/schema.sql

      - name: Build & Package backend
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3307/apple_repair_service_test
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: 123456
          JWT_SECRET: ci-test-secret-key-ci-test-secret-key
        run: mvn --batch-mode package -Dmaven.test.skip=true

  frontend:
    name: Frontend - React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Show Node.js version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
