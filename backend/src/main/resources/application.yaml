spring:
  profiles:
    active: local
  application:
    name: apple-repair-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/apple_repair_service}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    deserialization:
      fail-on-unknown-properties: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:apple-repair-local-development-secret-2026-very-secure}
      expiration: ${JWT_EXPIRATION:PT1H}
      issuer: apple-repair-service
    public-docs: ${API_DOCS_ENABLED:false}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  ml:
    enabled: ${ML_ENABLED:true}
    base-url: ${ML_SERVICE_BASE_URL:http://localhost:8001}
    connect-timeout: ${ML_CONNECT_TIMEOUT:1s}
    read-timeout: ${ML_READ_TIMEOUT:3s}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
