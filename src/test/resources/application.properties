# Test-only signing key. Never packaged in the executable application JAR.
app.security.jwt.secret=TEST-ONLY-API-SIGNING-KEY-NOT-FOR-LOCAL-OR-PRODUCTION
app.security.public-docs=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
debug=false
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Default tests never point at the local business database. Override only with an isolated test DB.
spring.datasource.url=${TEST_DATABASE_URL:jdbc:mysql://localhost:3307/apple_repair_service_test}
