name: apple-repair-service-production

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Ho_Chi_Minh
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+07:00"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [internal]

  ml:
    image: ${ML_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Ho_Chi_Minh
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on: { mysql: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [internal]

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
      ML_ENABLED: "true"
      ML_SERVICE_BASE_URL: http://ml:8001
      BOOTSTRAP_ADMIN_ENABLED: "false"
    depends_on:
      mysql: { condition: service_healthy }
      ml: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/device-types || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [internal]

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    ports: ["127.0.0.1:${APP_HTTP_PORT:-8080}:80"]
    depends_on: { backend: { condition: service_healthy } }
    networks: [edge, internal]

networks:
  edge: { driver: bridge }
  internal: { driver: bridge, internal: true }
volumes:
  mysql-data:
